flutter_native_splash:
  # Background color of the splash screen
  color: "#000000"

  # Logo image to place in the center
  image: "assets/images/splash_ios_android_11.png"

  # Platforms to generate splash screens for
  android: true
  ios: true

  # Android 12+ (API 31+) native splash screen configuration
  android_12:
    image: "assets/images/splash_android_12.png"
    color: "#000000"
